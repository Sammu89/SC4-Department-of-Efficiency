; Department of Efficiency - Education and Health funding. The Department starts ACTIVE after the installation.
; To switch it off: repeal the ordinance 'Department of Efficiency', untick 'Department active' in Play Options > Department of Efficiency, or set Mode=Off here.
; Mode: Off | Shadow (log the decisions only) | Auto. Re-read every month. An unknown key or a bad value makes the plugin fall back to Off.

[DepartmentEfficiency]
Mode=Auto
ReservePercent=5
Education=true
Health=true
MinFundingPercent=1
MaxFundingPercent=120
