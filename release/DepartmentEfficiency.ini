; Department of Efficiency - ONE configuration file with three independent sections: [AutoFinance] (Education and Health), [UtilityResearch] (Power, Water, Garbage and regional
; neighbor contracts) and [LotDemolition] (clearing of destroyed and long-abandoned lots). Each section has its own Mode. The Department starts ACTIVE after the installation.
; To switch everything off: repeal the ordinance 'Department of Efficiency' or untick 'Department active' in Play Options > Department of Efficiency (they set the three Mode keys to Off).
; The file is re-read every month and whenever the options window or the ordinance changes it. A missing or invalid section keeps the safe default (Off) of that section only.

[AutoFinance]
; Education and Health funding.
; Mode: Off | Shadow (log the decisions only) | Auto. An unknown key or a bad value in this section makes the Education / Health funding fall back to Off.
Mode=Auto
ReservePercent=5
Education=true
Health=true
MinFundingPercent=1
MaxFundingPercent=120

[UtilityResearch]
; Each manager (AutoPower, AutoWater, AutoGarbage, AutoDeals) can be turned off on its own in the options window. The file is re-read every month.
; AutoTradePower / AutoTradeWater / AutoTradeGarbage: the Department may create, adjust and cancel the contracts of that resource in both directions (buy and sell).
; false = it never touches the contracts of that resource. They need AutoDeals and do not depend on AutoPower / AutoWater / AutoGarbage.
; The old AutoImportPower / AutoImportWater / AutoExportGarbage keys are obsolete: still accepted, ignored.
; DetailedDecisionLog=false keeps the log small (one line per verified action); set it to true only to diagnose a decision.
; MinContractBenefit: a facultative regional contract must bring at least this many $ per month (never applied to contracts the service needs).
Enabled=true
Detail=false
Debug=false
Mode=Auto
EnableUnifiedAuto=true
DetailedDecisionLog=false
MinContractBenefit=0
AutoPower=true
AutoWater=true
AutoGarbage=true
AutoDeals=true
PowerReservePercent=20
WaterReservePercent=10
GarbageReservePercent=2
ConsiderPowerAging=false
ProtectWaterPipes=true
AllowUtilityArbitrage=false
AutoTradePower=true
AutoTradeWater=true
AutoTradeGarbage=true
; WarnLandfillSizeSavings: false (default) = silent. true = the Department tells you, with one notice that names the area and links to it, when zoning an area next to the landfill or dezoning an empty edge strip would lower the sanitation bill. It only tells: it never builds or removes anything for this advice and changes no funding or contract.
WarnLandfillSizeSavings=false
; LandfillSavingsAlertThreshold: 25 (default) = the notice is given only when the change saves MORE than 25% of the monthly sanitation expense (maintenance included). Whole percent from 20 to 50.
LandfillSavingsAlertThreshold=25
PowerCadenceDays=10
WaterCadenceDays=10
CountImports=true
ExportReserve=true
UseRequirement=true
HealthHorizonMonths=120
WaterMinPercent=50
Power=true
Water=true
Phase8Runtime=false

[LotDemolition]
; All the rules and their defaults: docs/LOT_DEMOLITION.md of the project.
; To switch it off: untick the demolition options in Play Options > Department of Efficiency, or set Mode=Off here. Mode: Off | Shadow (the log says what WOULD be demolished) | Auto.
Mode=Auto
DestroyedAfterDays=30
AbandonedAfterDays=365
DemolishMunicipalAndHistoricRuins=false
MaxPerRun=150
LimitMonthlyBudget=false
MonthlyBudget=1000
